# COCO Robustness Benchmark — central configuration.
# All scripts read paths/params from here so clean/distorted/enhanced/finetuned
# variants stay directly comparable.

seed: 7

paths:
  data_root: data
  coco_root: data/coco                # images + annotations live here
  splits_dir: data/splits
  distorted_root: data/distorted      # data/distorted/{type}/sev{n}/
  enhanced_root: data/enhanced        # data/enhanced/{type}/sev{n}/
  results_root: results
  preds_dir: results/preds
  metrics_dir: results/metrics
  figures_dir: results/figures
  models_dir: models

dataset:
  val_split: val2017
  train_split: train2017
  ann_instances_val: data/coco/annotations/instances_val2017.json
  ann_keypoints_val: data/coco/annotations/person_keypoints_val2017.json
  ann_instances_train: data/coco/annotations/instances_train2017.json
  # panoptic GT (separate download: panoptic_annotations_trainval2017.zip)
  ann_panoptic_val: data/coco/annotations/panoptic_val2017.json
  panoptic_val_dir: data/coco/annotations/panoptic_val2017     # per-image PNG masks
  val_subset_size: 1500               # fixed seeded subset of val2017
  # After the seeded random sample, top up images so every class reaches at
  # least this many GT instances (bounded by its availability in val2017).
  # Fixes high-variance per-class AP for rare classes (e.g. microwave n=7).
  val_min_class_instances: 20
  train_subset_size: 9000             # train2017 subset for fine-tuning (real GT).
                                      # The v3 mixture spreads it over clean + 9
                                      # raw + 9 restored domains, so each cell
                                      # still gets ~375 raw + ~375 restored images.
                                      # Selection is prefix-stable: growing the
                                      # size only ADDS images (same shuffled order).
  val_subset_file: data/splits/val_subset.json
  train_subset_file: data/splits/train_subset.json

# Tasks to run (low + high level):
#   features     = ORB keypoint matching vs clean (low-level, CPU, no GT needed)
#   detection    = YOLOv8 (object detection, COCOeval bbox mAP)
#   keypoints    = Keypoint R-CNN (COCOeval keypoints / OKS)
#   segmentation = Panoptic FPN via detectron2 (panoptic quality, PQ)
tasks:
  - features
  - detection
  - keypoints
  - segmentation

# Low-level feature task (ORB): match ratio = good matches / clean keypoints.
orb:
  nfeatures: 800
  distance_threshold: 64

# Matched classical enhancement (Phase 3).
enhancement:
  # bm3d = non-blind BM3D fed the logged per-image noise sigma from
  #        snr_index.csv (v3; +4-5 dB PSNR over NLM at every severity).
  # nlm  = sigma-adaptive Non-Local Means (v2, kept for comparison — it hurt
  #        keypoints/segmentation at every severity; see docs/archive/).
  gauss_method: bm3d
  # BM3D is memory-bandwidth-bound: ~2-4 core-minutes/image, and per-worker
  # throughput drops as workers saturate the node's memory channels — use the
  # 128-core/8-channel rxn nodes for the full set. Capped to the SLURM
  # allocation at runtime.
  workers: 128

# Three corruptions chosen in the main README. Three severities each.
distortions:
  gauss_noise:
    severities:
      low:  {var_limit: [100.0, 300.0]}
      med:  {var_limit: [500.0, 1000.0]}
      high: {var_limit: [1500.0, 2500.0]}
  salt_pepper:
    severities:
      low:  {amount: 0.01}
      med:  {amount: 0.05}
      high: {amount: 0.12}
  motion_blur:
    severities:
      low:  {ksize: 5}
      med:  {ksize: 11}
      high: {ksize: 21}

inference:
  device: cuda                        # falls back to cpu if unavailable
  score_threshold: 0.05               # keep low for COCOeval (it sweeps thresholds); = YOLO conf

# Object detection = YOLOv8 (ultralytics). yolov8n = nano; bump to yolov8s/m for
# higher accuracy if GPU time allows.
yolo:
  weights: yolov8n.pt
  imgsz: 640

# Panoptic segmentation = Panoptic FPN (detectron2). Runs in a dedicated venv
# (.venv-det) with a detectron2-compatible torch; the main pipeline calls it as
# a subprocess. PQ is computed with panopticapi against COCO panoptic GT.
segmentation:
  detectron2_python: .venv-det/bin/python
  config: COCO-PanopticSegmentation/panoptic_fpn_R_50_3x.yaml
  score_threshold: 0.5

finetune:
  # fine-tune YOLOv8 on corrupted train2017 with real COCO GT (converted to YOLO
  # labels). Training data is a per-image seeded MIXTURE — single-corruption
  # training measurably negative-transfers to every other cell (it hurt all
  # motion-blur and low-severity cells).
  #
  # v3 mixture: clean with p=clean_fraction, else one of the 9 distortion
  # cells uniformly; a distorted pick is then passed through the matched
  # classical restorer with p=restored_fraction. Fixes the two v2 failures:
  #  - clean_fraction 0.25 (v2: 1/10) — v2's fine-tune cost 0.068 mAP on clean
  #    images, which made it LOSE to the pretrained model on every
  #    low-severity cell (near-clean inputs);
  #  - restored_fraction 0.5 (v2: 0) — v2 never trained on restored images,
  #    so enhance→finetuned scored BELOW enhance→pretrained on salt & pepper
  #    at every severity (domain mismatch on the exact inputs the deployment
  #    decision matrix feeds the model).
  clean_fraction: 0.25
  restored_fraction: 0.5
  epochs: 30
  batch_size: 16
  imgsz: 640
  lr0: 1.0e-4                         # AdamW, pinned (optimizer=auto silently overrides lr0)
  patience: 10
  val_fraction: 0.1                   # held-out split of the TRAIN subset for best.pt selection
  workdir: yolo_work                  # YOLO dataset (images/ + labels/ + data.yaml)
  # showcase cell for per-class figures (training itself uses the mixture)
  distortion: gauss_noise
  severity: high
  checkpoint: models/yolov8_finetuned.pt
